<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="hp-csrf" content="CSRF_VALUE"><title>HP ローカル確認</title><style>
:root{font:14px/1.65 system-ui,sans-serif;color-scheme:light dark;color:CanvasText;background:Canvas}*{box-sizing:border-box}body{margin:0}#local-preview{width:100%;height:100vh;border:0;background:white}#menu{position:fixed;right:20px;bottom:20px;width:min(350px,calc(100vw - 32px));background:Canvas;border:1px solid ButtonBorder;border-radius:16px;padding:18px;box-shadow:0 8px 30px #0003}h1{font-size:18px;margin:0 0 8px;font-weight:600}p{margin:8px 0}button{font:inherit;padding:9px 12px;border:1px solid ButtonBorder;border-radius:8px;background:ButtonFace;color:ButtonText;cursor:pointer}button:disabled{opacity:.45;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:8px}.muted{color:GrayText;font-size:12px}.mono{font-family:monospace;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}dialog{width:min(940px,calc(100vw - 24px));max-height:94vh;background:Canvas;color:CanvasText;border:1px solid ButtonBorder;border-radius:16px;padding:20px}dialog::backdrop{background:#0008}#remote-preview{width:100%;height:45vh;border:1px solid ButtonBorder}.summary{white-space:pre-wrap}a{color:LinkText;overflow-wrap:anywhere}#error{color:MarkText;background:Mark;padding:6px;border-radius:6px}[hidden]{display:none!important}@media(max-width:480px){#menu{right:12px;bottom:12px;padding:12px}#remote-preview{height:34vh}}
</style></head><body><iframe id="local-preview" title="編集中のローカルサイト" src="SITE_URL" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
<section id="menu" aria-label="ホームページ操作"><button id="toggle" type="button" aria-expanded="true" style="float:right">閉じる</button><h1>ローカルの表示確認</h1><div id="menu-body"><p id="local-status" role="status">確認中…</p><p class="muted">編集内容は自動で表示に反映します。保存・確認ページ・公開は別の操作です。</p><p id="account" class="muted"></p><p id="operation-status"></p><p id="last-confirmation"></p><p id="error" role="alert" hidden></p><div class="actions"><button id="prepare" disabled>確認ページを作る</button><button id="open" disabled>公開内容を確認</button><button id="previous" hidden>前回の結果</button><button id="refresh">状況を確認</button><button id="retry-preview" hidden>同じ依頼で再確認</button><button id="resume" hidden>同じ処理を再開</button></div><p class="muted">未保存の内容はCodexに下書き保存を依頼してください。</p></div></section>
<dialog id="confirmation"><h1 id="dialog-title">公開内容の確認</h1><p id="mode"></p><p id="site-name"></p><p id="summary" class="summary"></p><p>確認ページを別タブで開き、文章・画像・リンクをご確認ください。この画面に戻って、下の確認ボタンを押します。</p><p><a id="preview-link" target="_blank" rel="noopener noreferrer">確認ページを別タブで開く</a></p><p>公開先: <a id="production-link" target="_blank" rel="noopener noreferrer"></a></p><details><summary>確認情報</summary><p id="artifact" class="mono muted"></p><p id="operation-id" class="mono muted"></p></details><p id="confirm-status" role="status"></p><div class="actions"><button id="confirm" disabled>確認</button><button id="withdraw" hidden>前の確認を取り消してやり直す</button><button id="close">閉じる</button></div></dialog><script src="/control.js"></script></body></html>
