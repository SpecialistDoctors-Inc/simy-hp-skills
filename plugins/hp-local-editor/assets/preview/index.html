<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="hp-csrf" content="CSRF_VALUE">
  <title>HP ローカル確認</title>
  <style>
    :root {
      font: 14px/1.65 "Inter", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
      color-scheme: light dark;
      --surface: #fff;
      --canvas: #f8f9fc;
      --ink: #242536;
      --muted: #6c7080;
      --line: #e9eaf0;
      --accent: #6654d9;
      --accent-hover: #5645c5;
      --tint: #efecfb;
      --focus: #a99aef;
      --danger-bg: #fff1ee;
      --danger-ink: #963c2c;
      color: var(--ink);
      background: var(--canvas);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible, a:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    a { color: var(--accent); }
    p { margin: 0; }
    [hidden] { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    #local-preview { display: block; width: 100%; height: 100dvh; border: 0; background: white; }
    #launcher {
      position: fixed; right: 24px; bottom: 24px; z-index: 11;
      width: 58px; height: 58px; display: grid; place-items: center;
      color: #fff; background: var(--accent); border: 1px solid #ffffff30; border-radius: 21px;
      box-shadow: 0 8px 24px #41308c30, 0 2px 6px #24253614;
    }
    #launcher:hover { background: var(--accent-hover); transform: translateY(-2px); }
    .icon {
      display: block; width: 18px; height: 18px; flex-shrink: 0;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    #launcher .icon { width: 26px; height: 26px; }
    #launcher .launcher-collapse { display: none; }
    #launcher[aria-expanded="true"] .launcher-chat { display: none; }
    #launcher[aria-expanded="true"] .launcher-collapse { display: block; }
    #menu {
      position: fixed; right: 24px; bottom: 98px; z-index: 10;
      width: min(410px, calc(100vw - 32px)); height: min(660px, calc(100dvh - 126px));
      display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid var(--line); border-radius: 24px; background: var(--surface);
      box-shadow: 0 20px 65px #20203c1a, 0 4px 14px #20203c0b;
    }
    .chat-header {
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
      padding: 16px 20px; border-bottom: 1px solid var(--line);
    }
    .brand-mark {
      display: grid; place-items: center; flex: 0 0 40px; width: 40px; height: 40px;
      border-radius: 14px; background: var(--tint); color: var(--accent);
      font-size: 21px; font-weight: 650;
    }
    .header-copy { flex: 1; min-width: 0; }
    h1 { margin: 0; font-size: 15px; font-weight: 600; }
    #account { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #toggle {
      display: grid; place-items: center; width: 32px; height: 32px; padding: 0;
      border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 24px;
    }
    #toggle:hover { background: var(--canvas); color: var(--ink); }
    #menu-body {
      flex: 1; min-height: 0; padding: 24px 20px 18px; overflow-y: auto;
      overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    }
    #welcome { padding: 14px 2px 24px; }
    #welcome h2 { margin: 0 0 8px; font-size: 22px; line-height: 1.5; font-weight: 600; }
    #welcome p { color: var(--muted); font-size: 13px; line-height: 1.8; }
    .suggestions { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 22px; }
    .suggestions button {
      color: var(--ink); background: var(--surface); padding: 9px 13px;
      border: 1px solid var(--line); border-radius: 12px; font-size: 13px;
    }
    .suggestions button:hover { border-color: var(--focus); background: var(--tint); }
    #chat-messages:empty { display: none; }
    .message { margin: 0 0 22px; }
    .message p { white-space: pre-wrap; overflow-wrap: anywhere; }
    .message .speaker { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; margin-bottom: 8px; }
    .message.assistant .speaker::before {
      content: 'S'; display: grid; place-items: center; width: 20px; height: 20px;
      color: var(--accent); background: var(--tint); border-radius: 7px; font-size: 11px; font-weight: 600;
    }
    .message.assistant > .message-body { padding-left: 2px; line-height: 1.85; }
    .message.user { margin-left: 38px; }
    .message.user .speaker { position: absolute; clip: rect(0, 0, 0, 0); width: 1px; height: 1px; overflow: hidden; }
    .message.user > .message-body {
      padding: 12px 15px; border-radius: 16px 16px 5px 16px;
      background: var(--tint); color: var(--ink); line-height: 1.8;
    }
    #workflow { flex-shrink: 0; border-top: 1px solid var(--line); padding: 12px 20px 0; margin: 0; }
    #workflow p { font-size: 12px; color: var(--muted); }
    #environment-updates { display: flex; align-items: center; flex-wrap: wrap; gap: 7px 14px; font-size: 11px; color: var(--muted); }
    .environment { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
    .environment .version { color: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; }
    #workflow #next-step { font-size: 12px; margin-top: 7px; }
    #workflow .actions { margin-top: 9px; }
    #workflow p:empty, #connection-status:empty, #chat-availability:empty { display: none; }
    #workflow p + p:not(:empty) { margin-top: 5px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions button, .actions a {
      text-decoration: none; padding: 9px 13px; border: 1px solid var(--line); border-radius: 11px;
      font-size: 12px; font-weight: 500; line-height: 1.5; color: var(--ink); background: var(--surface);
    }
    .actions button:hover:enabled, .actions a:hover { border-color: var(--focus); background: var(--tint); }
    .actions #open, .actions #prepare, .actions #confirm { color: #fff; background: var(--accent); border-color: var(--accent); }
    .actions #open:hover:enabled, .actions #prepare:hover:enabled, .actions #confirm:hover:enabled { background: var(--accent-hover); }
    .actions a, #preview-link { display: inline-flex; align-items: center; gap: 7px; }
    .external-icon { width: 14px; height: 14px; opacity: .7; }
    #previous { color: var(--muted); }
    #connection-status { margin-top: 14px; font-size: 12px; color: var(--muted); }
    #error { margin-top: 14px; padding: 12px; border-radius: 12px; font-size: 12px; color: var(--danger-ink); background: var(--danger-bg); }
    #composer { flex-shrink: 0; padding: 12px 16px 16px; background: var(--surface); }
    .input-shell { border: 1px solid var(--line); border-radius: 17px; padding: 12px 12px 10px; background: var(--canvas); }
    .input-shell:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 8%, transparent); }
    #chat-input {
      display: block; width: 100%; resize: none; height: 42px; min-height: 42px; max-height: 136px;
      padding: 0 2px; border: 0; outline: none; color: var(--ink); background: transparent; font-size: 13px; line-height: 1.7;
    }
    #chat-input::placeholder { color: var(--muted); }
    #composer-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
    #chat-availability { flex: 1; font-size: 11px; line-height: 1.6; color: var(--muted); }
    #send {
      flex: 0 0 38px; display: grid; place-items: center; width: 38px; height: 38px;
      padding: 0; color: #fff; background: var(--accent); border: 0; border-radius: 50%;
    }
    #send .icon { width: 20px; height: 20px; stroke-width: 2; }
    #send:hover:enabled { background: var(--accent-hover); }
    .undo-edit {
      display: inline-flex; align-items: center; margin: 10px 0 0; padding: 5px 0;
      color: var(--muted); background: transparent; border: 0; font-size: 11px;
      text-underline-offset: 3px;
    }
    .undo-edit:hover:enabled { color: var(--accent); text-decoration: underline; }
    .undo-state { margin-top: 9px; color: var(--muted); font-size: 11px; }
    #latest-reply {
      align-self: center; margin: -16px 0 8px; z-index: 1; padding: 7px 12px;
      border: 1px solid var(--line); border-radius: 20px; background: var(--surface);
      color: var(--accent); font-size: 12px; box-shadow: 0 2px 8px #20203c14;
    }
    #chat-retry { border: 0; color: var(--accent); background: transparent; padding: 4px; font-size: 12px; white-space: nowrap; }
    dialog {
      width: min(510px, calc(100vw - 32px)); max-height: 90dvh; overflow: auto;
      padding: 28px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
      border-radius: 22px; box-shadow: 0 24px 70px #17152d26;
    }
    dialog::backdrop { background: #1c193a59; backdrop-filter: blur(3px); }
    dialog h1 { margin: 0 0 12px; font-size: 20px; }
    dialog p { margin: 10px 0; overflow-wrap: anywhere; }
    dialog #changes-note, dialog #confirm-status { color: var(--muted); font-size: 13px; }
    dialog #site-name { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
    #version-change { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    #change-list { list-style: none; padding: 0; margin: 20px 0; }
    #change-list li + li { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
    .change-title { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .change-before, .change-after { display: block; font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; }
    .change-before { color: var(--muted); text-decoration: line-through; }
    .dialog-links { display: flex; gap: 16px; font-size: 13px; }
    dialog .actions { margin-top: 22px; }
    .mono { font-family: monospace; overflow-wrap: anywhere; font-size: 11px; }
    .summary { white-space: pre-wrap; }
    details { margin: 18px 0; color: var(--muted); font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      :root { --surface: #20212b; --canvas: #1b1c25; --ink: #eeedf6; --muted: #a5a5b7; --line: #353543; --accent: #7060d5; --accent-hover: #8877ed; --tint: #302b45; --focus: #9d8fee; --danger-bg: #412b29; --danger-ink: #ffc4b5; }
    }
    @media (max-width: 480px) {
      #launcher { right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); width: 52px; height: 52px; border-radius: 18px; }
      #menu { right: 12px; bottom: calc(82px + env(safe-area-inset-bottom)); width: calc(100vw - 24px); height: min(620px, calc(100dvh - 104px - env(safe-area-inset-bottom))); border-radius: 22px; }
      .chat-header { padding: 16px 18px; }
      #menu-body { padding: 20px 16px 16px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      #menu { animation: appear .18s ease-out; transform-origin: bottom right; }
      #launcher, button, .actions a { transition: background .15s, box-shadow .15s, transform .15s; }
      @keyframes appear { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <iframe id="local-preview" title="編集中のローカルサイト" src="SITE_URL" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
  <button id="launcher" type="button" aria-label="HP編集チャットを開く" aria-expanded="false" aria-controls="menu">
    <svg class="icon launcher-chat" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg>
    <svg class="icon launcher-collapse" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <section id="menu" aria-label="HP編集チャット" hidden>
    <header class="chat-header">
      <span class="brand-mark" aria-hidden="true">S</span>
      <div class="header-copy"><h1>ホームページ編集</h1><p id="account"></p></div>
      <button id="toggle" type="button" aria-label="チャットを閉じる"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </header>
    <div id="menu-body">
      <div id="welcome">
        <h2>どこを直しましょう？</h2>
        <p>文章や診療時間など、<br>変えたいことを教えてください。</p>
        <div class="suggestions" aria-label="修正依頼の例">
          <button id="suggest-copy" type="button">文章を直したい</button>
          <button id="suggest-hours" type="button">診療時間を変えたい</button>
        </div>
      </div>
      <div id="chat-messages" role="log" aria-live="polite" aria-label="Codexとの会話"></div>

      <p id="connection-status" role="status">接続を確認しています…</p>
      <p id="error" role="alert" hidden></p>
    </div>
    <button id="latest-reply" type="button" hidden>最新の返信を見る</button>
      <section id="workflow" aria-label="変更の反映" hidden>
        <div id="environment-updates" aria-label="各環境のバージョン">
          <span id="dev-environment" class="environment"><span>確認用</span><span class="version" id="dev-version">—</span></span>
          <span id="production-environment" class="environment"><span>公開中</span><span class="version" id="production-version">—</span></span>
        </div>
        <p id="next-step" role="status" hidden></p>
        <div class="actions">
          <button id="prepare" disabled>確認用に反映</button>
          <a id="dev-link" target="_blank" rel="noopener noreferrer" hidden>確認用サイトを開く<svg class="icon external-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 3h6v6M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg></a>
          <button id="open" hidden disabled>公開する</button>
          <button id="previous" hidden>公開結果を見る</button>
          <button id="retry-preview" hidden>同じ依頼で再確認</button>
          <button id="resume" hidden>処理を再開</button>
        </div>
      </section>
    <form id="composer">
      <div class="input-shell">
        <label for="chat-input" class="sr-only">修正したいこと</label>
        <textarea id="chat-input" placeholder="例：診療時間を18時までに変えて" maxlength="4000" disabled aria-describedby="chat-availability"></textarea>
        <div id="composer-footer">
          <p id="chat-availability">接続を確認しています…</p>
          <button id="chat-retry" type="button" hidden>修正を再開</button>
          <button id="send" type="submit" aria-label="送信" title="送信（Enter）" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
        </div>
      </div>
    </form>
  </section>
  <dialog id="confirmation">
    <p id="site-name"></p>
    <h1 id="dialog-title">公開内容を確認</h1>
    <p id="version-change"></p>
    <ul id="change-list" aria-label="変更内容"></ul>
    <p id="changes-note" hidden></p>
    <p id="confirm-status" role="status" hidden></p>
    <div class="dialog-links">
      <a id="preview-link" target="_blank" rel="noopener noreferrer">変更後を見る</a>
      <a id="production-link" target="_blank" rel="noopener noreferrer">公開中を見る</a>
    </div>
    <div class="actions"><button id="confirm" disabled>公開する</button><button id="withdraw" hidden>取り消す</button><button id="close">閉じる</button></div>
  </dialog>
  <script src="/control.js"></script>
</body>
</html>
