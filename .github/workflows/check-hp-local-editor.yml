name: Check local HP editor

on:
  pull_request:
    paths:
      - 'plugins/hp-local-editor/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/check-hp-local-editor.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/hp-local-editor/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/check-hp-local-editor.yml'

permissions:
  contents: read

jobs:
  local-helper:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify local packages and interruption recovery
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify automatic preview status and publication controls
        run: node --test tests/test_preview_ui.cjs
      - name: Check whitespace
        run: git diff --check

  native-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install build-only locked dependencies
        run: python -m pip install --require-hashes -r tools/requirements-build.lock
      - name: Build native plugin and exercise packaged commands without PATH tools
        run: |
          python tools/build_desktop_plugin.py --output output/native-ci
          python tools/smoke_native.py output/native-ci/package/plugins/hp-local-editor/bin/hp
