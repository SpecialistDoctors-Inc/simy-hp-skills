name: Check local HP editor

on:
  pull_request:
    paths:
      - 'plugins/hp-local-editor/**'
      - 'tests/**'
      - '.github/workflows/check-hp-local-editor.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/hp-local-editor/**'
      - 'tests/**'
      - '.github/workflows/check-hp-local-editor.yml'

permissions:
  contents: read

jobs:
  local-helper:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify local packages and interruption recovery
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
